# Railway deploy config for the SECPulse FastAPI backend.
# Dashboard: attach a persistent volume at mount path /data
# (SQLite lives at sqlite:////data/secpulse.db — see Dockerfile ENV).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m backend.main"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
